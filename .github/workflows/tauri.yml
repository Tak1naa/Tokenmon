name: Tauri 构建

on:
  workflow_dispatch:
  push:
    tags: ["v2*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: 单元测试(Rust 数据层 + 前端核心)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Rust 工具链
        run: rustup default stable

      - name: cargo test(tokenmon-core)
        working-directory: tauri/src-tauri
        run: cargo test -p tokenmon-core

      - name: cargo check(整个 workspace, 验证 tauri 壳编译)
        working-directory: tauri/src-tauri
        run: cargo check --workspace

      - name: node 测试(前端核心逻辑)
        working-directory: tauri
        run: node --test tests/core.test.mjs

  build:
    name: 构建 ${{ matrix.platform }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 依赖
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Rust 工具链
        run: rustup default stable

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri
          tagName: ${{ github.ref_name }}
          releaseName: "TokenMon ${{ github.ref_name }}"
          releaseBody: |
            TokenMon —— 精灵球样式 LLM 网关 token 用量监视器。
            - Windows: TokenMon_${{ github.ref_name }}_x64-setup.exe(NSIS 安装包, 系统自带 WebView2)
            - Linux: .deb / .rpm / .AppImage(需系统 webkit2gtk4.1 运行时)
          releaseDraft: true
          prerelease: false
