[workspace]
members = ["core"]
resolver = "2"

[package]
name = "tokenmon"
version = "2.0.0"
description = "TokenMon —— 精灵球样式 LLM 网关 token 用量监视器"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenmon-core = { path = "core" }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"
cairo-rs = { version = "0.18", features = ["png"] }

# ---- 体积优化: 十几兆目标 ----
[profile.release]
opt-level = "s"      # 优化体积
lto = true           # 链接时优化, 删除未用代码(对话历史等)
codegen-units = 1    # 更好优化
strip = true         # 自动剥离符号(免手动 strip)
