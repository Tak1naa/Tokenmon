[package]
name = "tokenmon-core"
version = "2.0.0"
edition = "2021"
description = "TokenMon 数据层: 配置加载 / 网关抓取 / 解析聚合(无 GUI 依赖)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
